name: Branch Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo and EAS
        if: github.ref_name == 'develop' && env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build web export
        run: bun run build:web

      - name: Package web build
        run: tar -czf web-dist.tar.gz dist

      - name: Build Android APK (EAS)
        if: github.ref_name == 'develop' && env.EXPO_TOKEN != ''
        id: eas_build
        run: |
          bunx eas build --platform android --profile preview --non-interactive --json > eas-build.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(d)?d[0]:d; if(!b?.id){process.exit(1)}; console.log('build_id='+b.id)" >> "$GITHUB_OUTPUT"

      - name: Download Android APK
        if: github.ref_name == 'develop' && env.EXPO_TOKEN != ''
        run: bunx eas build:download --platform android --id ${{ steps.eas_build.outputs.build_id }} --path app-preview.apk

      - name: Generate release metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TS="$(date -u +'%Y%m%d-%H%M%S')"
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH}-${TS}-${SHORT_SHA}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release for main
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Main Release ${{ steps.meta.outputs.short_sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            web-dist.tar.gz

      - name: Create pre-release for develop (with APK)
        if: github.ref_name == 'develop' && env.EXPO_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Develop Preview ${{ steps.meta.outputs.short_sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            web-dist.tar.gz
            app-preview.apk

      - name: Create pre-release for develop (web only)
        if: github.ref_name == 'develop' && env.EXPO_TOKEN == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Develop Preview ${{ steps.meta.outputs.short_sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            web-dist.tar.gz
