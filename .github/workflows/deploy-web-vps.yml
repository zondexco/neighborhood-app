name: Deploy Web VPS

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SSH auth configuration
        run: |
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "Missing SSH auth: set VPS_SSH_KEY or VPS_PASSWORD in GitHub secrets."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build web export
        run: bun run build:web

      - name: Package web dist
        run: tar -czf web-dist.tar.gz dist

      - name: Upload package to VPS (SSH key)
        if: env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: web-dist.tar.gz
          target: /tmp

      - name: Upload package to VPS (password)
        if: env.SSH_KEY == '' && env.SSH_PASSWORD != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: web-dist.tar.gz
          target: /tmp

      - name: Deploy web on VPS (SSH key)
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            WEB_ROOT="${{ secrets.VPS_WEB_ROOT }}"
            if [ -z "$WEB_ROOT" ]; then
              WEB_ROOT="/var/www/neighborhood-app"
            fi
            sudo mkdir -p "$WEB_ROOT"
            sudo tar -xzf /tmp/web-dist.tar.gz -C "$WEB_ROOT"
            sudo rm -f /tmp/web-dist.tar.gz

      - name: Deploy web on VPS (password)
        if: env.SSH_KEY == '' && env.SSH_PASSWORD != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            WEB_ROOT="${{ secrets.VPS_WEB_ROOT }}"
            if [ -z "$WEB_ROOT" ]; then
              WEB_ROOT="/var/www/neighborhood-app"
            fi
            sudo mkdir -p "$WEB_ROOT"
            sudo tar -xzf /tmp/web-dist.tar.gz -C "$WEB_ROOT"
            sudo rm -f /tmp/web-dist.tar.gz
