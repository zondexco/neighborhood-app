# Nginx config for Expo static web build
# Domain: napp.enux.dev
# Ports: 80/443

server {
    listen 80;
    listen [::]:80;
    server_name napp.enux.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name napp.enux.dev;

    # Expo export output path (adjust if needed)
    root /var/www/neighborhood-app/dist;
    index index.html;

    # TLS (Let's Encrypt example)
    ssl_certificate /etc/letsencrypt/live/napp.enux.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napp.enux.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/napp.enux.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP tuned for Expo web bundles (adjust if using extra external providers)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: wss:;" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Deny hidden files except ACME challenge
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Cache immutable static assets aggressively
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Prevent caching index to avoid stale deployments
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA fallback for Expo Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional basic hardening limits
    client_max_body_size 10m;
    keepalive_timeout 65;
}
